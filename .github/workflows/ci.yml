name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-validate:
    name: Test + Agent Harness Validation
    runs-on: [self-hosted, ai_universe_living_blog]
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: ""

      - name: Set up Java 21 (required by Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
        # On self-hosted macOS, setup-java may need sudo for Python deps.
        # If this step fails, JAVA_HOME is set manually below instead.
        continue-on-error: true

      - name: Set JAVA_HOME if setup-java failed (self-hosted macOS fallback)
        run: |
          if ! java -version 2>/dev/null; then
            JAVA_CACHED=$(ls -d ~/actions-runner-aub2/_work/_tool/Java_Temurin-Hotspot_jdk/*/arm64/Contents/Home 2>/dev/null | tail -1 || ls -d ~/actions-runner-aub/_work/_tool/Java_Temurin-Hotspot_jdk/*/arm64/Contents/Home 2>/dev/null | tail -1 || true)
            if [ -n "$JAVA_CACHED" ]; then
              echo "JAVA_HOME=$JAVA_CACHED" >> "$GITHUB_ENV"
              echo "PATH=$JAVA_CACHED/bin:$PATH" >> "$GITHUB_ENV"
              echo "Using cached Java: $JAVA_CACHED"
            fi
          fi

      - name: Cache Firebase emulator JARs
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulator-v1.20.4
          restore-keys: firebase-emulator-

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Start Firestore emulator
        run: |
          npm install -g firebase-tools
          firebase emulators:start --only firestore --project test-project &
          # Poll Firestore REST API until it returns an HTTP response (up to 120s).
          # The emulator needs JVM startup + gRPC binding time after port opens.
          # Cache hit: JAR already present → ready quickly.
          # Cache miss: downloads ~90MB JAR → may take 30-60s extra.
          for i in $(seq 1 120); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/v1/projects/test-project/databases/(default)/documents" 2>/dev/null || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "404" ] || [ "$STATUS" = "400" ]; then
              echo "Firestore emulator HTTP ready (${i}s, status=${STATUS})"
              break
            fi
            if [ "$i" -eq 120 ]; then
              echo "Firestore emulator failed to start after 120s"
              exit 1
            fi
            sleep 1
          done
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080

      - name: Run tests
        # Skip install smoke test — it requires a full npm-linked install and
        # is tested separately in the install.sh authoring workflow.
        # Firestore emulator enables the storage-firestore.test.ts tests (normally skipped without emulator).
        run: npm test -- --exclude=tests/install.test.ts
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIRESTORE_PROJECT_ID: test-project
          GCLOUD_PROJECT: test-project

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
        # On self-hosted macOS, setup-python may need sudo for installation.
        # python3 is already available via Homebrew — continue-on-error is safe.
        continue-on-error: true

      - name: Run agent harness validation
        run: python3 scripts/agent_repo_check.py
