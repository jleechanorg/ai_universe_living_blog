name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-validate:
    name: Test + Agent Harness Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Start Firestore emulator
        run: |
          npm install -g firebase-tools
          firebase emulators:start --only firestore --project test-project &
          # Poll Firestore REST API until it returns an HTTP response (up to 40s).
          # nc -z only checks TCP; the HTTP/gRPC handler needs extra warmup time.
          for i in $(seq 1 40); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8080/v1/projects/test-project/databases/(default)/documents" 2>/dev/null || echo "000")
            if [ "$STATUS" != "000" ]; then
              echo "Firestore emulator HTTP ready (${i}s, status=${STATUS})"
              break
            fi
            sleep 1
          done
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080

      - name: Run tests
        # Skip install smoke test — it requires a full npm-linked install and
        # is tested separately in the install.sh authoring workflow.
        # Firestore emulator enables the storage-firestore.test.ts tests (normally skipped without emulator).
        run: npm test -- --exclude=tests/install.test.ts
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FIRESTORE_PROJECT_ID: test-project
          GCLOUD_PROJECT: test-project

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Run agent harness validation
        run: python3 scripts/agent_repo_check.py
