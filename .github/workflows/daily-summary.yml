name: Daily Novel Summary

on:
  schedule:
    - cron: '30 23 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD)'
        default: ''
        required: false

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: ''

      - name: Install dependencies
        run: npm ci

      - name: Run daily summary
        env:
          NODE_ENV: production
          INPUT_DATE: ${{ inputs.date }}
        run: |
          DATE_ARG=""
          if [ -n "$INPUT_DATE" ]; then
            DATE_ARG="--date=$INPUT_DATE"
          fi
          npx tsx src/novel/cli.ts daily-summary \
            --repo=jleechanorg/ai_universe_living_blog \
            --session=daily-${{ github.run_id }} \
            "$DATE_ARG" 
