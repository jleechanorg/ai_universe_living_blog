name: Skeptic Cron

# Runs every 30 minutes — evaluates all open PRs with lightweight gate and merges when ready.
# Standalone: no external CLI or local actions required.
# Skeptic gate: (1) CI passing, (2) mergeable=MERGEABLE, (3) no CHANGES_REQUESTED reviews.
# Posts VERDICT: PASS or VERDICT: FAIL comment (with SHA marker) so skeptic-gate.yml can poll.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  skeptic_cron:
    name: Skeptic Cron
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      checks: read
    outputs:
      prs_evaluated: ${{ steps.list_prs.outputs.pr_numbers }}
      merged_count: ${{ steps.evaluate_and_merge.outputs.merged_count }}
    steps:
      - name: List open PRs
        id: list_prs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_JSON=$(gh api repos/${{ github.repository }}/pulls \
            --jq '[.[] | select(.draft == false) | {number, title, head: {ref: .head.ref, sha: .head.sha}, base: {ref: .base.ref}}]')

          echo "Open non-draft PRs found:"
          echo "$PR_JSON" | jq -c '.[]' 2>/dev/null || echo "$PR_JSON"

          echo "pr_numbers=$(echo "$PR_JSON" | jq -c '.')" >> "$GITHUB_OUTPUT"
          echo "pr_count=$(echo "$PR_JSON" | jq 'length')" >> "$GITHUB_OUTPUT"

      - name: Evaluate PRs and post VERDICT
        id: evaluate_and_merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_JSON: ${{ steps.list_prs.outputs.pr_numbers }}
          STALE_HOURS: ${{ vars.STALE_HOURS || '3' }}
        run: |
          MERGED=0

          for PR in $(echo "$PR_JSON" | jq -r '.[] | @base64'); do
            PR_DATA=$(echo "$PR" | base64 -d)
            PR_NUM=$(echo "$PR_DATA" | jq -r '.number')
            PR_TITLE=$(echo "$PR_DATA" | jq -r '.title')
            HEAD_SHA=$(echo "$PR_DATA" | jq -r '.head.sha')

            echo ""
            echo "========================================"
            echo "Evaluating PR #${PR_NUM} — ${PR_TITLE}"
            echo "SHA: ${HEAD_SHA:0:7}"
            echo "========================================"

            FAIL_REASONS=""

            # 1. CI green — check check-runs, excluding Skeptic Gate itself (circular dependency)
            # Neutral (cursor bugbot) and skipped count as passing.
            CHECK_RUNS=$(gh api repos/${{ github.repository }}/commits/"$HEAD_SHA"/check-runs \
              --jq '[.check_runs[] | select(.conclusion != null and .conclusion != "skipped" and .name != "Skeptic Gate" and .name != "Skeptic Cron") | .conclusion] | if length == 0 then "no_checks" elif all(. == "success" or . == "neutral") then "success" else "failure" end' 2>/dev/null || echo "error")

            CI_OK=false
            if [ "$CHECK_RUNS" = "success" ] || [ "$CHECK_RUNS" = "no_checks" ]; then
              CI_OK=true
            fi

            if [ "$CI_OK" = "false" ]; then
              FAIL_REASONS="${FAIL_REASONS}CI not green (checks=$CHECK_RUNS); "
              echo "  [1] CI green:           FAIL (checks=$CHECK_RUNS)"
            else
              echo "  [1] CI green:           PASS"
            fi

            # 2. No merge conflicts
            PR_DETAIL=$(gh api repos/${{ github.repository }}/pulls/"$PR_NUM" \
              --jq '{mergeable: .mergeable, mergeable_state: .mergeable_state, merged: .merged}' 2>/dev/null || echo '{"mergeable":null,"mergeable_state":"unknown","merged":false}')
            MERGEABLE=$(echo "$PR_DETAIL" | jq -r '.mergeable // "null"')
            MERGEABLE_STATE=$(echo "$PR_DETAIL" | jq -r '.mergeable_state // "unknown"')
            MERGED_FLAG=$(echo "$PR_DETAIL" | jq -r '.merged // false')

            if [ "$MERGEABLE" = "true" ] || [ "$MERGED_FLAG" = "true" ]; then
              echo "  [2] No merge conflicts: PASS (mergeable=$MERGEABLE)"
            else
              FAIL_REASONS="${FAIL_REASONS}Merge conflict or unknown (mergeable=$MERGEABLE state=$MERGEABLE_STATE); "
              echo "  [2] No merge conflicts: FAIL (mergeable=$MERGEABLE state=$MERGEABLE_STATE)"
            fi

            # 3. No CHANGES_REQUESTED reviews (latest review per reviewer only)
            # group_by(.user.login) ensures we check the most recent review from each reviewer,
            # so a COMMENTED or APPROVED re-review supersedes a prior CHANGES_REQUESTED.
            CHANGES_REQUESTED=$(gh api repos/${{ github.repository }}/pulls/"$PR_NUM"/reviews \
              --jq '[group_by(.user.login) | .[] | max_by(.submitted_at) | select(.state == "CHANGES_REQUESTED")] | length' 2>/dev/null || echo 0)
            if [ "$CHANGES_REQUESTED" = "0" ] || [ -z "$CHANGES_REQUESTED" ]; then
              echo "  [3] No CHANGES_REQ:     PASS"
            else
              FAIL_REASONS="${FAIL_REASONS}${CHANGES_REQUESTED} CHANGES_REQUESTED review(s); "
              echo "  [3] No CHANGES_REQ:     FAIL ($CHANGES_REQUESTED review(s))"
            fi

            # Compute verdict
            SHA_MARKER="<!-- skeptic-gate-trigger-${HEAD_SHA} -->"
            if [ -z "$FAIL_REASONS" ]; then
              VERDICT="PASS"
              VERDICT_BODY=$(printf "## Skeptic Gate\n\n**VERDICT: PASS** :white_check_mark:\n\nAll lightweight checks passed for commit \`%s\`:\n- CI: green\n- Mergeable: yes\n- Reviews: no CHANGES_REQUESTED\n\n%s" "${HEAD_SHA:0:7}" "$SHA_MARKER")
              echo "  => VERDICT: PASS"
              # Write for merge step
              echo "VERDICT: PASS" > "skeptic-output-${PR_NUM}.txt"
            else
              VERDICT="FAIL"
              VERDICT_BODY=$(printf "## Skeptic Gate\n\n**VERDICT: FAIL** :x:\n\nCommit \`%s\` did not pass all checks:\n- %s\n\n%s" "${HEAD_SHA:0:7}" "$FAIL_REASONS" "$SHA_MARKER")
              echo "  => VERDICT: FAIL (${FAIL_REASONS})"
              # Write for merge step
              echo "VERDICT: FAIL" > "skeptic-output-${PR_NUM}.txt"
            fi

            # Post VERDICT comment (always post — gate polls for updated_at)
            # Find existing skeptic verdict comment for this SHA to update or create
            EXISTING_COMMENT_ID=$(gh api repos/${{ github.repository }}/issues/"$PR_NUM"/comments \
              --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | test(\"VERDICT:\"; \"i\")) and (.body | test(\"skeptic-gate-trigger-\"; \"i\")))] | .[-1].id // empty" \
              2>/dev/null || echo "")

            if [ -n "$EXISTING_COMMENT_ID" ] && [ "$EXISTING_COMMENT_ID" != "null" ]; then
              # Update existing verdict comment
              gh api repos/${{ github.repository }}/issues/comments/"$EXISTING_COMMENT_ID" \
                --method PATCH \
                -f body="$VERDICT_BODY" \
                > /dev/null 2>&1 && echo "  Updated existing verdict comment #${EXISTING_COMMENT_ID}" \
                || echo "  WARNING: Failed to update verdict comment"
            else
              # Create new verdict comment
              gh api repos/${{ github.repository }}/issues/"$PR_NUM"/comments \
                --method POST \
                -f body="$VERDICT_BODY" \
                > /dev/null 2>&1 && echo "  Posted new verdict comment" \
                || echo "  WARNING: Failed to post verdict comment"
            fi

            # Auto-merge on PASS (7-green simplified: CI + mergeable + no CR)
            if [ "$VERDICT" = "PASS" ]; then
              if [ "$MERGED_FLAG" = "true" ]; then
                echo "  Already merged — skipping"
              else
                echo ""
                echo "*** PR #${PR_NUM} is merge-ready! Merging... ***"
                MERGE_RESULT=$(gh pr merge "$PR_NUM" \
                  --repo ${{ github.repository }} \
                  --squash \
                  --delete-branch \
                  2>&1 || echo "MERGE_FAILED")
                if echo "$MERGE_RESULT" | grep -Ei "MERGE_FAILED|error"; then
                  echo "Merge failed for PR #${PR_NUM}: $MERGE_RESULT"
                else
                  echo "Successfully merged PR #${PR_NUM}"
                  MERGED=$((MERGED + 1))
                fi
              fi
            else
              echo "PR #${PR_NUM} not yet merge-ready — skipping merge"
            fi
          done

          echo "merged_count=$MERGED" >> "$GITHUB_OUTPUT"
          echo ""
          echo "=== Skeptic cron complete: $MERGED PR(s) merged ==="
